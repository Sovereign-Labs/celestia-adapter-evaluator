name: Publish image

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    strategy:
      fail-fast: true
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: linux/amd64
          - runner: ubuntu-24.04-arm
            platform: linux/arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history + tags so build.rs's `git describe --exact-match` can
          # resolve a tag on HEAD inside the Docker build (a shallow checkout has
          # neither). `.git` is part of the build context and derives the version.
          fetch-depth: 0
          fetch-tags: true

      - name: Compute lowercase image name
        id: img
        run: |
          name="ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')"
          echo "name=$name" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ steps.img.outputs.name }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=${{ matrix.platform }}

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digest-${{ strategy.job-index }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history + tags so `git describe --exact-match` can resolve a tag
          # on HEAD (a shallow checkout has neither).
          fetch-depth: 0
          fetch-tags: true

      - name: Compute image tags
        id: tags
        run: |
          full="${{ github.sha }}"
          if [ -z "$full" ]; then
            echo "::error::Failed to resolve repository commit SHA"
            exit 1
          fi
          short="${full:0:12}"
          echo "short=$short" >> "$GITHUB_OUTPUT"

          # Always tag with the short SHA for traceability. When HEAD is exactly
          # tagged, also tag with the git tag (both point at the same manifest).
          tags="$short"
          if git_tag="$(git describe --exact-match --tags HEAD 2>/dev/null)"; then
            tags="$git_tag"$'\n'"$short"
            echo "Tagging with git tag '$git_tag' and short SHA '$short'"
          else
            echo "No tag on HEAD; tagging with short SHA '$short' only"
          fi
          # Multi-line output for the manifest-create step to consume.
          {
            echo "list<<EOF"
            echo "$tags"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Compute lowercase image name
        id: img
        run: |
          name="ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')"
          echo "name=$name" >> "$GITHUB_OUTPUT"

      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digest-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create multi-arch manifest
        working-directory: /tmp/digests
        run: |
          # One -t per resolved tag (git tag and/or short SHA), all pointing at
          # the same multi-arch manifest assembled from the per-arch digests.
          tag_args=()
          while IFS= read -r tag; do
            [ -n "$tag" ] || continue
            tag_args+=(-t "${{ steps.img.outputs.name }}:$tag")
          done <<< "${{ steps.tags.outputs.list }}"

          docker buildx imagetools create \
            "${tag_args[@]}" \
            $(printf "${{ steps.img.outputs.name }}@sha256:%s " *)

      - name: Inspect
        run: |
          docker buildx imagetools inspect \
            "${{ steps.img.outputs.name }}:${{ steps.tags.outputs.short }}"
