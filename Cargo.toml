[package]
name = "celestia-adapter-evaluator"
version = "0.1.0"
edition = "2024"
license = "Sovereign Permissionless Commercial License"
authors = ["Sovereign Labs <info@sovereign.xyz>"]
homepage = "https://www.sovereign.xyz"
publish = false
repository = "https://github.com/sovereign-labs/sovereign-sdk"

[dependencies]
anyhow = "1"
rand = "0.8"
rusqlite = { version = "0.32", features = ["bundled"] }
clap = { version = "4.5", features = ["derive"] }
hex = "0.4"
bip32 = "0.5"
bip39 = "2"
tokio = { version = "1.48", features = ["full"] }
tracing = { version = "0.1.43" }
tracing-subscriber = { version = "0.3.22", features = ["env-filter"] }

# CometBFT consensus RPC client for the historical `block_results` read loop.
tendermint = "0.40"
tendermint-rpc = { version = "0.40", features = ["http-client"] }

# dev branch on 2026-06-25
sov-celestia-adapter = { git = "https://github.com/Sovereign-Labs/sovereign-sdk.git", rev = "ac48a43268d92039c22a96ec7c0786c208cf5eae", features = ["native"] }
sov-rollup-interface = { git = "https://github.com/Sovereign-Labs/sovereign-sdk.git", rev = "ac48a43268d92039c22a96ec7c0786c208cf5eae", features = ["native"] }
# Direct handle on the metrics pipeline so we can emit our own measurements
# (block_results reads) through the same Telegraf tracker the adapter initializes.
sov-metrics = { git = "https://github.com/Sovereign-Labs/sovereign-sdk.git", rev = "ac48a43268d92039c22a96ec7c0786c208cf5eae", features = ["native"] }
sov-shutdown = { git = "https://github.com/Sovereign-Labs/sovereign-sdk.git", rev = "ac48a43268d92039c22a96ec7c0786c208cf5eae" }
